name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Windows PowerShell, since the icon is drawn by loading the source into .NET Framework.
      - name: Build KnightSight.exe
        shell: powershell
        run: .\build.ps1

      - name: Check the MCP server
        run: node --check mcp/knightsight-mcp.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: KnightSight
          path: dist/KnightSight.exe
